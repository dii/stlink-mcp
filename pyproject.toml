[project]
name = "stlink-mcp"
version = "0.1.0"
description = "An MCP server for programming and inspecting STM32 targets over ST-LINK, where every tool verifies its own effect before reporting success."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "stm32", "st-link", "embedded", "debugging", "firmware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "mcp>=2.0.0",
    "pyserial>=3.5",
]

[project.scripts]
stlink-mcp = "stlink_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stlink_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
