[project]
name = "stlink-mcp"
dynamic = ["version"]
description = "An MCP server for programming and inspecting STM32 targets over ST-LINK, where every tool verifies its own effect before reporting success."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dawid Oosthuizen", email = "dawid.oosthuizen@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "stm32", "st-link", "embedded", "debugging", "firmware"]
# Linux only, deliberately. macOS is plausible and untried, so it is not
# claimed here; Windows is wrong throughout, not merely untested. The Python
# classifiers name the declared floor and the version the suite is actually
# run on, and nothing above it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Embedded Systems",
]

# mcp is capped below the next major version. server.py is written against the
# 2.x MCPServer API, which was itself a rename from 1.x's FastMCP, and the
# roadmap's standing check is to re-verify on every SDK bump rather than assume.
dependencies = [
    "mcp>=2.0.0,<3",
    "pyelftools>=0.31",
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/dii/stlink-mcp"
Repository = "https://github.com/dii/stlink-mcp"
Issues = "https://github.com/dii/stlink-mcp/issues"

[project.scripts]
stlink-mcp = "stlink_mcp.__main__:main"

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stlink_mcp"]

# The sdist contents are an explicit include list, not an exclude rule.
# Hatchling builds an sdist from the filesystem, honouring this repo's
# .gitignore but not the user's global ignore file, so a file git never tracked
# can still be published. That happened here once (docs/findings.md, "The
# packaging tool publishes what git hides"). An include list stops the next
# locally-ignored working file from going out the same silent way.
[tool.hatch.build.targets.sdist]
include = [
    ".gitattributes",
    "src/stlink_mcp",
    "tests",
    "tools",
    "docs",
    "AGENTS.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "GEMINI.md",
    "LICENSE",
    "README.md",
    "ROADMAP.md",
    "pyproject.toml",
    "uv.lock",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The annotated git tag is the only copy of the version. A build past the last
# tag reports "<tag>+<commits since the tag>", and an uncommitted tree adds
# ".dirty"; a checkout with no tag reports 0.0.0+N. Freeze tags under freeze/
# are never read as versions.
#
# A tree with no git metadata at all, which is what GitHub's "Download ZIP" and
# `git archive` produce, builds as 0.0.0+unknown rather than failing to install:
# without default-version versioningit raised NotSdistError there, and
# `uv sync` stopped before the README's first step had finished. "unknown" is
# the honest answer, since nothing in such a tree says which commit it is.
[tool.hatch.version]
source = "versioningit"

[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.vcs]
method = "git"
match = ["v[0-9]*"]
default-tag = "v0.0.0"

[tool.versioningit.tag2version]
rmprefix = "v"

[tool.versioningit.format]
distance = "{base_version}+{distance}"
dirty = "{base_version}+0.dirty"
distance-dirty = "{base_version}+{distance}.dirty"
